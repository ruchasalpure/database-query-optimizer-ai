spec_version: "0.1.0"
name: database-query-optimizer-ai
version: 1.0.0
description: Analyzes complex SQL execution plans, index hit ratios, and join topologies to automatically synthesize missing partial, BRIN, and composite indexes.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - query-plan-synthesis
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - devtools
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/database-query-optimizer-ai"
